name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # NumPy 2.0+ requires Python 3.9+, but Numba may not support all combos
          - os: windows-latest
            python-version: "3.9"

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov ruff mypy scikit-learn bandit safety
        pip install -e .
        
    - name: Run Ruff (Static Analysis)
      run: |
        ruff check src/ --ignore E722,PLR0124,F841,SIM102,RUF059,BLE001,F821,PERF402,UP035,UP006,I001
        
    - name: Run Security Scans (Bandit & Safety)
      run: |
        bandit -r src/
        # Safety might fail on some unpinned transitive dependencies, but good for alerting
        safety check --full-report || true
        
    - name: Run PyTest & Coverage (Fast Suite)
      run: |
        pytest tests/ -m "not stress" --cov=src/bsscl_gbm > pytest-${{ matrix.os }}-${{ matrix.python-version }}.log 2>&1 || true

    - name: Commit PyTest Log
      if: always()
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git pull origin main || true
        git add pytest-*.log
        git commit -m "Upload log for ${{ matrix.os }} ${{ matrix.python-version }}" || true
        git push || true
        
        # Now we exit with the proper code
        if grep -q "FAILED" pytest-${{ matrix.os }}-${{ matrix.python-version }}.log; then exit 1; fi
